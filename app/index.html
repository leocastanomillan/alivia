<style>
body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; display: flex; justify-content: center; }
.container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
h2 { text-align: center; color: #00A651; }
label { display: block; margin-top: 10px; color: #333; font-weight: bold; }
input, select, button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
.dimensiones { display: flex; gap: 5px; margin-top: 5px; }
.dimensiones input { flex: 1 1 0; min-width: 0; }
button { background-color: #00A651; color: white; font-weight: bold; border: none; cursor: pointer; }
button:hover { background-color: #008F44; }
#mensaje { margin-top: 10px; padding: 10px; display: none; border-radius: 5px; }
#mensaje.error { background-color: #fdecea; color: #b71c1c; }
#resultado { margin-top: 10px; }
.item-label { font-weight: bold; }
.total-button {
    display: block;
    width: 100%;
    padding: 12px;
    background-color: #FFD900;
    color: green;
    text-align: center;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    margin-top: 10px;
    font-weight: bold;
    box-sizing: border-box;
    line-height: 1;
}
.reset-button { margin-top: 10px; background-color: #555; }
.reset-button:hover { background-color: #333; }
@media (max-width: 500px) {
    .container { max-width: 100%; padding: 15px; }
    .dimensiones { flex-direction: column; }
    input, select, button { font-size: 18px; padding: 14px; }
}
</style>
</head>

<div class="container">
<h2>Cotiza tu envío a Colombia y otros países</h2>
<label for="pais">País de destino:</label>

<option value="Colombia">Colombia</option>
</select>
<div id="colombiaFields">
<label for="tipoEnvioCol">Tipo de envío:</label>

<option value="Caja">Caja</option>
</select>
<div id="cajaFieldsCol">
<label for="pesoCol">Peso (libras):</label>
<input type="number" id="pesoCol" min="1" max="110" value="1">
<small>Máximo permitido 110 lb.</small>
<label for="valorDeclaradoCol">Valor declarado ($):</label>
<input type="number" id="valorDeclaradoCol" min="30" max="2000" value="30">
<small>Máximo permitido $2000USD.</small>
<label>Dimensiones de la caja (pulgadas):</label>
<div class="dimensiones">
<input type="number" id="ancho" placeholder="Ancho" min="12" value="12">
<input type="number" id="alto" placeholder="Alto" min="12" value="12">
<input type="number" id="largo" placeholder="Largo" min="12" value="12">
</div>
</div>
</div>
<div id="otrosFields" style="display:none;">
<label for="peso">Peso (libras):</label>
<input type="number" id="peso" min="1" max="100" value="1">
<small>Maximo 100 lb.</small>
</div>
<button onclick="calcularEnvio()">Calcular envío</button>
<div id="mensaje"></div>
<div id="resultado"></div>
<button id="botonReset" class="reset-button" onclick="reiniciarFormulario()">Cotizar otro envío</button>

function cargarPaises() {
    const paisesOrdenados = paises.sort((a, b) => a.nombre.localeCompare(b.nombre));
    paisesOrdenados.forEach(pais => {
        if (pais.nombre !== 'Colombia' && pais.nombre !== 'Estados Unidos') {
            const option = document.createElement('option');
            option.value = pais.nombre;
            option.textContent = `${pais.nombre} (${pais.codigo})`;
            paisSelect.appendChild(option);
        }
    });
}

function toggleCotizador() {
    const pais = paisSelect.value;
    if (pais === 'Colombia') {
        colombiaFields.style.display = 'block';
        otrosFields.style.display = 'none';

    document.getElementById('peso').value = 1;

    tipoEnvioColSelect.value = 'Documento';
    paisSelect.value = 'Colombia';
    toggleCotizador();
    limpiarMensajes();

    // 🕒 Espera 300 ms antes de hacer scroll para que sea más fluido
    setTimeout(() => {
        document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
    }, 300);
}


function limpiarMensajes() {
    mensajeDiv.style.display = 'none';
    mensajeDiv.textContent = '';
    resultadoDiv.innerHTML = '';
}

function calcularEnvio() {
    limpiarMensajes();
    const pais = paisSelect.value;

    if (pais === 'Colombia') {
        const tipoEnvio = tipoEnvioColSelect.value;
        const peso = parseFloat(document.getElementById('pesoCol').value);
        const valorDeclarado = parseFloat(document.getElementById('valorDeclaradoCol').value);
        const ancho = parseFloat(document.getElementById('ancho').value);
        const alto = parseFloat(document.getElementById('alto').value);
        const largo = parseFloat(document.getElementById('largo').value);

        if (tipoEnvio === 'Caja' && peso > 110) {
            mostrarMensaje('El peso máximo permitido es 110 lb.', true);
            return;
        }
        if (valorDeclarado > 2000) {
            mostrarMensaje('El valor declarado máximo permitido es $2000.', true);
            return;
        }

        let flete = 0, seguro = 6, redespacho = 6, volumen = 0, arancel = 0;

        if (tipoEnvio === 'Documento') {
            flete = 11;
        } else if (tipoEnvio === 'Caja') {
            flete = peso <= 15 ? 22.5 : 22.5 + (peso - 15) * 1.5;
            const volumenLibras = (ancho * alto * largo) / 139;
            if (volumenLibras > peso) {
                volumen = (volumenLibras - peso) * 0.5;
            }
        }

        const seguroCalc = Math.max(valorDeclarado * 0.06, seguro);
        if (valorDeclarado > 200) {
            arancel = valorDeclarado * 0.31;
        }

        const total = flete + seguroCalc + redespacho + volumen + arancel;
        const flag = getFlagEmoji('CO');

        mostrarResultado([
            { label: 'País', valor: `${flag} Colombia` },
            { label: 'Flete', valor: flete.toFixed(2) },
            { label: 'Seguro', valor: seguroCalc.toFixed(2) },
            { label: 'Redespacho', valor: redespacho.toFixed(2) },
            { label: 'Volumen', valor: volumen.toFixed(2) },
            { label: 'Arancel', valor: arancel.toFixed(2) },
            { label: 'TOTAL', valor: total.toFixed(2), destacado: true }
        ]);
    } else {
        const peso = parseFloat(document.getElementById('peso').value);
        const paisObj = paises.find(p => p.nombre === pais);
        const zona = paisObj ? paisObj.zona : null;
        const flag = getFlagEmoji(paisObj.codigo.toUpperCase());

        if (peso > 200) {
            mostrarMensaje('El peso máximo permitido es 200 lb.', true);
            return;
        }

        const tarifas = tarifasPorZona[zona];
        let tarifa;

        if (peso <= 50) {
            tarifa = tarifas[peso - 1];
        } else {
            const tarifaBase = tarifas[49];
            const librasExtra = peso - 50;
            const adicionalPorLibra = tarifaPorLibraZona[zona];
            tarifa = tarifaBase + (librasExtra * adicionalPorLibra);
        }

        mostrarResultado([
            { label: 'País', valor: `${flag} ${pais}` },
            { label: 'Zona', valor: zona },
            { label: 'Flete', valor: tarifa.toFixed(2) },
            { label: 'TOTAL', valor: tarifa.toFixed(2), destacado: true }
        ]);
    }
}

function mostrarMensaje(texto, esError = false) {
    mensajeDiv.textContent = texto;
    mensajeDiv.className = esError ? 'error' : '';
    mensajeDiv.style.display = 'block';
}

function mostrarResultado(items) {
    let html = '';
    items.forEach(item => {
        if (!item.destacado) {
            if (item.label === 'País' || item.label === 'Zona') {
                html += `<div><span class="item-label">${item.label}:</span> ${item.valor}</div>`;
            } else {
                html += `<div><span class="item-label">${item.label}:</span> $${item.valor}</div>`;
            }
        }
    });
    const totalItem = items.find(item => item.destacado);
    if (totalItem) {
        html += `<div class="total-button">${totalItem.label}: $${totalItem.valor}</div>`;
    }
    resultadoDiv.innerHTML = html;

    // 👇 Aquí agregamos el scroll hacia los resultados
    setTimeout(() => {
    const target = document.getElementById('botonReset');
    const yOffset = -80; // Ajusta esto para compensar lo que se ve en iPhone
    const y = target.getBoundingClientRect().top + window.pageYOffset + yOffset;

    window.scrollTo({ top: y, behavior: 'smooth' });
}, 200);


}

function getFlagEmoji(countryCode) {
    if (!countryCode || countryCode.length !== 2) {
        return countryCode;
    }
    const codePoints = countryCode.toUpperCase().split('').map(char => 127397 + char.charCodeAt());
    return String.fromCodePoint(...codePoints);
}

document.addEventListener('DOMContentLoaded', () => {
    cargarPaises();
    toggleCotizador();
});
</script>
